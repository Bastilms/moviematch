# MovieMatch Docker Compose configuration
#
# To use this file:
# 1. Build the Docker image: docker build -t moviematch:local .
# 2. Copy .env.example to .env: cp .env.example .env
# 3. Edit .env with your media server configuration
# 4. Ensure the ./data directory has correct permissions:
#    mkdir -p ./data && sudo chown -R 1000:1000 ./data
# 5. Start the services: docker compose up
#
# NOTE: This uses a bind mount to ./data. The directory must be writable
# by UID 1000 (the 'node' user inside the container).

services:
  moviematch:
    build: .
    image: moviematch:local
    container_name: moviematch
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/data
